name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: devspot }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devspot
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/devspot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devspot/db validate
      - run: pnpm --filter @devspot/db migrate:deploy
      # Fails when schema.prisma changed without a migration (exit code 2 means a diff remains).
      - run: pnpm --filter @devspot/db migrate:check
      - run: pnpm registry:check
      - run: pnpm check
      # M0.4: the first sync creates every organization; a second run must change nothing.
      - run: pnpm --silent --filter @devspot/db sync-registry | tail -1 | jq -e '.organizationsUpserted == .files'
      - run: pnpm --silent --filter @devspot/db sync-registry | tail -1 | jq -e '.organizationsUpserted == 0 and .unchanged == .files'
