name: Keepalive
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Supabase pauses a free project after 7 days without API requests.
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/usage_meters?select=period&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
      # Actions disables schedules in a public repo after 60 days without a commit.
      - uses: actions/checkout@v7
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 41 * 86400 )) ]; then exit 0; fi
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive"
          git push
