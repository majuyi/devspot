name: Engine
on:
  # The schedule that keeps sources fresh is a pg_cron job in Supabase that dispatches this
  # workflow every two hours with trigger=pg_cron (docs/09 §5): GitHub was starting scheduled
  # runs eight to nine hours late. GitHub's own schedule stays as a daily backup in case the
  # dispatch token lapses.
  schedule: [{ cron: "47 9 * * *" }]
  workflow_dispatch:
    inputs:
      source: { type: string, required: false, description: "Source key, e.g. devpost/hackathons" }
      trigger: { type: string, required: false, description: "Left empty by hand; pg_cron sends pg_cron" }
concurrency: { group: engine, cancel-in-progress: false }
permissions: { contents: read, actions: read }
defaults:
  run: { shell: bash }
jobs:
  # Automatic runs (the backup schedule and pg_cron) stop here if a run already succeeded in
  # the last 90 minutes, so a late or doubled trigger costs seconds, not a second full run.
  # Runs started by hand always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.recent.outputs.go }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.trigger == 'pg_cron' }}
        run: |
          if [ "$AUTOMATIC" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          # A run the gate skipped also ends as success, so count only runs whose run job
          # itself succeeded; otherwise one skip would cause the next.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/engine.yml/runs?status=success&created=>$since" \
            --jq '.workflow_runs[].id'); do
            ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "run" and .conclusion == "success")] | length')
            if [ "$ran" -gt 0 ]; then
              echo "skipped: run $id succeeded after $since"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The engine role can insert and update, never delete (docs/09 §3).
      DATABASE_URL: ${{ secrets.ENGINE_DATABASE_URL }}
      EXTRACTION_LLM: ${{ vars.EXTRACTION_LLM || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: corepack enable
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Builds the engine's dependencies: @devspot/schema is consumed from dist, and db
      # generates the Prisma client.
      - run: pnpm turbo build --filter "@devspot/engine^..."
      # Syncs the registry first, so a YAML change reaches production on the next run.
      # Exits 1 only on the run where a source turns erroring, which emails the maintainer.
      - run: pnpm --silent engine run ${{ inputs.source && format('--source {0}', inputs.source) || '' }} | tee run.log
      - if: success() || failure()
        run: pnpm --silent engine verify | tee verify.log
      # Refreshes the site now rather than within 15 minutes (docs/02 §6). Skipped until the
      # REVALIDATE_SECRET secret and the SITE_URL variable exist.
      - if: success() || failure()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "revalidate skipped: REVALIDATE_SECRET or SITE_URL not set"; exit 0
          fi
          curl -fsS --retry 2 -X POST -H "x-revalidate-secret: $REVALIDATE_SECRET" "$SITE_URL/api/revalidate"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-log
          path: "*.log"
          retention-days: 30
