name: Backup
on:
  schedule: [{ cron: "0 4 * * 0" }]
  workflow_dispatch:
permissions: { contents: read }
defaults:
  run: { shell: bash }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # pg_dump must be at least the server's major version; the runner's client is older.
      # Data only from public: the schema is in the migrations.
      - run: |
          docker run --rm -e DIRECT_URL postgres:17-alpine \
            sh -c 'pg_dump "$DIRECT_URL" --schema=public --no-owner --no-privileges --format=custom' \
            > devspot.dump
          test -s devspot.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output devspot.dump.gpg devspot.dump 3<<<"$BACKUP_PASSPHRASE"
          rm devspot.dump
      - uses: actions/upload-artifact@v7
        with:
          name: devspot-backup-${{ github.run_number }}
          path: devspot.dump.gpg
          retention-days: 90
