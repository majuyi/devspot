services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devspot
    # DB_PORT (from .env) moves the host port when another Postgres already has 5432.
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["devspot-pg:/var/lib/postgresql/data"]
volumes:
  devspot-pg:
